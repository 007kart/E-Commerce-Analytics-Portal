services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commercepulse
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - '5441:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d commercepulse']
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - commerce_pg:/var/lib/postgresql/data
volumes:
  commerce_pg:
